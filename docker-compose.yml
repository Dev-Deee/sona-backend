services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sona_db
      POSTGRES_USER: sona_user
      POSTGRES_PASSWORD: sona_pass
    ports:
      # Override with POSTGRES_PORT if 5432 is already used on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sona_user -d sona_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sona_db
      SPRING_DATASOURCE_USERNAME: sona_user
      SPRING_DATASOURCE_PASSWORD: sona_pass
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
