name: Backend CI

# Build + full test suite (unit, integration via Testcontainers, 80% coverage gate).
# Runs on develop, on every pull request into develop or main, and is reused by the deploy workflow.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sona_test
          POSTGRES_USER: sona_user
          POSTGRES_PASSWORD: sona_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      # Integration tests start their own PostgreSQL via Testcontainers (Docker is available on
      # ubuntu-latest); the service container above is kept for ad-hoc debugging steps.
      - name: Build, test and check coverage (≥ 80% lines)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sona_test
          SPRING_DATASOURCE_USERNAME: sona_user
          SPRING_DATASOURCE_PASSWORD: sona_pass
          JWT_SECRET: test-secret-key-at-least-256-bits-long-for-hs256
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build Docker image
        run: docker build -t sona-backend:ci .
