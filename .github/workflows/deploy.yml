name: Deploy Backend

# main is the release branch: every push re-runs the full CI, then deploys to Railway.
# Day-to-day work goes to develop via pull requests; merge develop → main to release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  check-secrets:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::RAILWAY_TOKEN is not set — add it in Settings → Secrets → Actions to enable deploys."
          fi

  deploy:
    name: Deploy to Railway
    needs: [ci, check-secrets]
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        uses: bervproject/railway-deploy@main
        env:
          # The action reads the token from the environment, not from an input.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          service: sona-backend
